server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Locations below use only `expires` (not add_header), so they inherit these.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # connect-src is broad because the API URL is set at build time and may be
    # on another origin. Sandboxed srcdoc report frames inherit this policy.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' http: https: ws: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # SPA fallback so client-side routes resolve on refresh
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }

    # Vite emits content-hashed files under /assets/
    location /assets/ {
        expires 1y;
        access_log off;
    }
}
