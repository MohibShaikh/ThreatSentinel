services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - ts-data:/app/data
      - ts-reports:/app/reports
      - ts-logs:/app/logs
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Must be reachable from the browser, not from inside the docker network
        VITE_API_URL: http://localhost:8000/api/v1
        VITE_API_TOKEN: dev-secret-key
    ports:
      - "3000:8080"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  ts-data:
  ts-reports:
  ts-logs:
